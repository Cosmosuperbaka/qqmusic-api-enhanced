name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # npm Trusted Publishing 用 GitHub OIDC 换取短期发布凭据；不需要 NPM_TOKEN。
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(pkg.version!==tag){console.error('Tag '+process.env.GITHUB_REF_NAME+' does not match package.json version '+pkg.version); process.exit(1)}"

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Publish
        run: npm publish --provenance --access public
