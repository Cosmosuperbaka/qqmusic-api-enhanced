name: Publish GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.8)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: gh-packages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.RELEASE_TAG.replace(/^v/,''); if(pkg.version!==tag){console.error('Tag '+process.env.RELEASE_TAG+' does not match package.json version '+pkg.version); process.exit(1)}"

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Publish scoped mirror to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .gh-package
          mkdir -p .gh-package
          cp -R module util main.js main.ts interface.d.ts README.md LICENSE THIRD_PARTY_NOTICES.md LICENSES .gh-package/
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@cosmosuperbaka/qqmusic-api-enhanced';
            pkg.publishConfig = {
              registry: 'https://npm.pkg.github.com',
              access: 'public',
            };
            fs.writeFileSync('.gh-package/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cd .gh-package
          printf '@cosmosuperbaka:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          npm publish --access public
