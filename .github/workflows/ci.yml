name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Node import smoke test
        run: |
          node --input-type=module -e "const api = (await import('./main.js')).default; if (typeof api.login_status !== 'function') throw new Error('login_status missing'); console.log('Node import ok')"

      - name: Verify package contents
        run: npm pack --dry-run > /dev/null
