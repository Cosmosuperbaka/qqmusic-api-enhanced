name: Feature request
description: 建议一个新能力或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不方便？希望达到什么效果？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以描述 API 形状、参数或期望的返回值。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 不要包含真实 Cookie、Token 或账号信息。
    validations:
      required: false
